<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Digital business card for Hasan Saed Ahmad, Frontend Developer.">
  <meta name="theme-color" content="#101827">
  <title>Hasan Saed Ahmad | Frontend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <article class="business-card" aria-labelledby="profile-name">
      <div class="card-glow" aria-hidden="true"></div>

      <header class="profile">
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="assets/hasan-profile.png"
            alt="Portrait of Hasan Saed Ahmad"
            width="160"
            height="160"
          >
          <span class="availability-dot" aria-label="Available for opportunities"></span>
        </div>

        <p class="eyebrow">DIGITAL BUSINESS CARD</p>
        <h1 id="profile-name">Hasan Saed Ahmad</h1>
        <p class="role">Frontend Developer</p>
        <p class="specialties">React.js <span>•</span> JavaScript</p>
      </header>

      <div class="rule"></div>

      <section class="contact-section" aria-labelledby="contact-heading">
        <div class="section-heading">
          <h2 id="contact-heading">Get in touch</h2>
          <span>CONTACT</span>
        </div>

        <a class="contact-row" href="tel:+201127346533">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h3l2 5-2 1.5a15 15 0 0 0 4.5 4.5L16 12l5 2v3c0 1.1-.9 2-2 2C10.7 19 5 13.3 5 6c0-1.7.8-3 2-3Z"/></svg>
          </span>
          <span class="contact-copy">
            <small>Phone</small>
            <strong>01127346533</strong>
          </span>
          <span class="external-mark" aria-hidden="true">↗</span>
        </a>

        <a class="contact-row" href="mailto:alkhwlyhasan777@gmail.com">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </span>
          <span class="contact-copy">
            <small>Email</small>
            <strong>alkhwlyhasan777@gmail.com</strong>
          </span>
          <span class="external-mark" aria-hidden="true">↗</span>
        </a>

        <a class="contact-row" href="https://portfoilo-ux8i.vercel.app/" target="_blank" rel="noopener noreferrer">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          </span>
          <span class="contact-copy">
            <small>Portfolio</small>
            <strong>portfoilo-ux8i.vercel.app</strong>
          </span>
          <span class="external-mark" aria-hidden="true">↗</span>
        </a>
      </section>

      <div class="rule"></div>

      <section class="social-section" aria-labelledby="social-heading">
        <div class="section-heading">
          <h2 id="social-heading">Connect with me</h2>
          <span>FOLLOW</span>
        </div>

        <div class="social-links">
          <a class="social-link" href="https://www.linkedin.com/in/hassan-saed1/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8v11M5 5v.01M10 19v-6a3 3 0 0 1 6 0v6M10 10v9M19 19v-6a6 6 0 0 0-9-5.2"/></svg>
          </a>
          <a class="social-link" href="https://github.com/alkhwlyhasan777-coder" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.5 1.5-4.5-2.5-6.5-3M15 22v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.8a5.3 5.3 0 0 0-1.4-3.7 4.9 4.9 0 0 0-.1-3.7S17.7 1 15 2.8a13 13 0 0 0-6 0C6.3 1 5.2 1.3 5.2 1.3a4.9 4.9 0 0 0-.1 3.7 5.3 5.3 0 0 0-1.4 3.7c0 5.3 3.2 6.5 6.2 6.8a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
          </a>
          <a class="social-link" href="mailto:alkhwlyhasan777@gmail.com" aria-label="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </a>
        </div>
      </section>

      <button class="save-button" id="save-contact" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>
        <span>Save Contact</span>
      </button>
      <p class="button-feedback" id="button-feedback" role="status" aria-live="polite"></p>

      <footer class="card-footer">
        <span>LET'S BUILD SOMETHING GREAT</span>
        <span>© <span id="year">2026</span> Hasan Saed Ahmad</span>
      </footer>
    </article>
  </main>
</body>
</html>
